<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ScholarGraph · 知识超图系统</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --indigo:#6366f1; --indigo-deep:#4f46e5; --indigo-soft:#eef2ff; --indigo-ring:rgba(99,102,241,.35);
    --ink:#0f172a; --ink-2:#475569; --ink-3:#94a3b8;
    --canvas:#0b1220; --canvas-2:#111a2e;
    --line:#e2e8f0; --card:#ffffff;
    --ok:#10b981; --warn:#f59e0b;
  }
  html,body{height:100%;}
  body{font-family:'Inter',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       color:var(--ink); background:#f7f8fc; -webkit-font-smoothing:antialiased; overflow:hidden;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  ::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9px;border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-thumb:hover{background:#94a3b8;background-clip:content-box;}

  /* ---------- app shell ---------- */
  .navbtn{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;
          border-radius:12px;color:var(--ink-2);font-weight:500;font-size:14px;transition:all .18s ease;cursor:pointer;}
  .navbtn svg{width:19px;height:19px;flex:none;}
  .navbtn:hover{background:#f1f3fb;color:var(--ink);}
  .navbtn.active{background:var(--indigo-soft);color:var(--indigo-deep);}
  .navbtn.active::before{content:'';position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--indigo);}

  .view{position:absolute;inset:0;opacity:0;transform:translateY(8px);pointer-events:none;
        transition:opacity .22s ease,transform .22s ease;}
  .view.show{opacity:1;transform:translateY(0);pointer-events:auto;}

  .lamp{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);
        padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;}
  .dot{width:7px;height:7px;border-radius:999px;}
  .dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(16,185,129,.15);}
  .dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(245,158,11,.18);animation:pulse 1.4s ease infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* ---------- search ---------- */
  .hero-input{transition:box-shadow .2s ease,transform .25s ease;}
  .hero-input:focus-within{box-shadow:0 8px 30px -6px var(--indigo-ring);transform:translateY(-1px);}
  .chip{font-size:13px;color:var(--ink-2);border:1px solid var(--line);background:#fff;padding:7px 13px;
        border-radius:999px;cursor:pointer;transition:all .16s ease;}
  .chip:hover{border-color:var(--indigo);color:var(--indigo-deep);background:var(--indigo-soft);transform:translateY(-1px);}

  .stage{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;transition:background .2s ease;}
  .stage .sdot{width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;
               border:1.5px solid var(--line);color:var(--ink-3);font-size:11px;background:#fff;flex:none;transition:all .25s ease;}
  .stage.done .sdot{background:var(--indigo);border-color:var(--indigo);color:#fff;}
  .stage.doing .sdot{border-color:var(--indigo);color:var(--indigo-deep);box-shadow:0 0 0 4px var(--indigo-soft);}
  .stage.doing{background:var(--indigo-soft);}
  .stage .bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;flex:1;min-width:40px;}
  .stage .bar>i{display:block;height:100%;width:0%;background:var(--indigo);border-radius:4px;transition:width .3s ease;}
  .stage.doing .bar>i{animation:ind 1.1s ease-in-out infinite;}
  @keyframes ind{0%{width:5%;margin-left:0}55%{width:70%}100%{width:95%;margin-left:5%}}

  .card{opacity:0;transform:translateY(10px);animation:cardIn .4s ease forwards;}
  @keyframes cardIn{to{opacity:1;transform:translateY(0);}}
  .pcard{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px 16px;cursor:pointer;
         transition:box-shadow .18s ease,transform .18s ease,border-color .18s ease;}
  .pcard:hover{box-shadow:0 10px 28px -10px rgba(15,23,42,.14);transform:translateY(-1px);border-color:#c7d2fe;}
  .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;}
  .badge.high{background:#ecfdf5;color:#059669;} .badge.partial{background:#f1f5f9;color:#64748b;}

  .seg{display:inline-flex;background:#eef0f6;border-radius:10px;padding:3px;}
  .seg button{font-size:13px;font-weight:500;padding:6px 14px;border-radius:8px;color:var(--ink-2);transition:all .18s ease;}
  .seg button.on{background:#fff;color:var(--indigo-deep);box-shadow:0 1px 3px rgba(15,23,42,.12);}

  .skeleton{border-radius:14px;background:linear-gradient(100deg,#eef0f4 40%,#f7f8fa 50%,#eef0f4 60%);
            background-size:200% 100%;animation:shim 1.2s linear infinite;}
  @keyframes shim{to{background-position:-200% 0}}

  /* ---------- graph explorer ---------- */
  #gcanvas{background:radial-gradient(1200px 700px at 70% 20%, #101a30 0%, var(--canvas) 60%);}
  .grail{width:250px;flex:none;background:#fff;border-right:1px solid var(--line);}
  .tool-btn{display:flex;align-items:center;gap:8px;width:100%;font-size:13px;color:var(--ink-2);padding:8px 10px;
            border-radius:9px;border:1px solid transparent;cursor:pointer;transition:all .15s ease;}
  .tool-btn:hover{background:#f1f3fb;color:var(--ink);}
  .tool-btn.on{background:var(--indigo-soft);color:var(--indigo-deep);border-color:#c7d2fe;}
  .lg-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);padding:4px 6px;border-radius:7px;
          cursor:pointer;user-select:none;transition:background .15s ease;}
  .lg-row:hover{background:#f1f3fb;} .lg-row.off{opacity:.38;}
  .lg-sw{width:12px;height:12px;border-radius:4px;flex:none;}

  #drawer{position:absolute;top:0;right:0;bottom:0;width:320px;background:#fff;border-left:1px solid var(--line);
          transform:translateX(105%);transition:transform .26s cubic-bezier(.32,.72,.28,1);z-index:20;box-shadow:-12px 0 30px -18px rgba(15,23,42,.25);}
  #drawer.open{transform:translateX(0);}
  .kv{font-size:12px;color:var(--ink-3);} .kv b{color:var(--ink);font-weight:600;}

  .empty-card{border:1px dashed #c7d2fe;background:#fbfbff;}
  .spin{width:16px;height:16px;border-radius:999px;border:2px solid #c7d2fe;border-top-color:var(--indigo);animation:rot .8s linear infinite;}
  @keyframes rot{to{transform:rotate(360deg)}}

  .fade-in{animation:fin .3s ease forwards;} @keyframes fin{from{opacity:0}to{opacity:1}}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;
         background:var(--ink);color:#e2e8f0;font-size:13px;padding:9px 16px;border-radius:10px;transition:all .25s ease;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<!-- ======================= APP SHELL ======================= -->
<div class="flex flex-col h-full">
  <!-- top bar -->
  <header class="h-[56px] flex-none flex items-center justify-between px-5 border-b border-[color:var(--line)] bg-white/80 backdrop-blur z-30">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-[10px] flex items-center justify-center text-white font-bold"
           style="background:linear-gradient(135deg,#6366f1,#8b5cf6)">◈</div>
      <div>
        <div class="text-[15px] font-semibold leading-none">ScholarGraph</div>
        <div class="text-[11px] text-[color:var(--ink-3)] leading-none mt-1">知识超图抽取 · Schema 自进化</div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span class="lamp"><span class="dot ok"></span>模型在线</span>
      <span class="lamp" id="lamp-graph"><span class="dot warn"></span><span id="lamp-graph-txt">图谱构建中</span></span>
      <span class="lamp mono" id="lamp-cost" title="本次会话抽取成本">$0.000</span>
    </div>
  </header>

  <div class="flex flex-1 min-h-0">
    <!-- left nav -->
    <nav class="w-[210px] flex-none border-r border-[color:var(--line)] bg-white p-4 flex flex-col gap-1">
      <div class="text-[11px] uppercase tracking-wider text-[color:var(--ink-3)] px-3 mb-1">工作台</div>
      <button class="navbtn active" data-view="search" onclick="showView('search')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        智能搜索
      </button>
      <button class="navbtn" data-view="graph" onclick="showView('graph')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="6" r="2.4"/><circle cx="19" cy="6" r="2.4"/><circle cx="12" cy="18" r="2.4"/><path d="M7 7.5l8.5 9M17 7.5L8.5 16.5M7.4 6h9.2"/></svg>
        知识图谱
      </button>
      <div class="mt-auto text-[11px] text-[color:var(--ink-3)] px-3 leading-relaxed">
        <div>语料 <span class="mono text-[color:var(--ink-2)]" id="nav-npapers">–</span> 篇</div>
        <div>知识边 <span class="mono text-[color:var(--ink-2)]" id="nav-nedges">–</span></div>
      </div>
    </nav>

    <!-- main area -->
    <main class="relative flex-1 min-w-0">
      <!-- ============ SEARCH VIEW ============ -->
      <section id="view-search" class="view show">
        <div class="h-full overflow-y-auto">
          <div class="max-w-[760px] mx-auto px-6 pt-10 pb-16">
            <h1 class="text-[26px] font-bold text-center">智能搜索</h1>
            <p class="text-center text-[13.5px] text-[color:var(--ink-2)] mt-2">复杂学术查询 · 多源召回 · 语义判分 · 知识超图增强</p>

            <div class="hero-input mt-7 flex items-center gap-2 bg-white border border-[color:var(--line)] rounded-2xl px-4 py-3.5">
              <svg class="w-5 h-5 text-[color:var(--ink-3)] flex-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              <input id="q" type="text" placeholder="输入一个复杂学术查询，例如：如何提升深度强化学习的样本效率？"
                     class="flex-1 outline-none text-[15px] bg-transparent" />
              <button id="go" onclick="runSearch()" class="flex-none text-white text-[14px] font-medium px-5 py-2 rounded-xl transition active:scale-95"
                      style="background:var(--indigo)">检索</button>
            </div>
            <div class="flex flex-wrap gap-2 mt-4 justify-center" id="chips"></div>

            <!-- stage timeline -->
            <div id="timeline" class="hidden mt-8 bg-white border border-[color:var(--line)] rounded-2xl p-4 fade-in">
              <div class="flex items-center justify-between mb-1">
                <div class="text-[13px] font-semibold">检索管线</div>
                <div class="mono text-[12px] text-[color:var(--ink-3)]"><span id="elapsed">0.0</span>s</div>
              </div>
              <div class="grid grid-cols-4 gap-1" id="stages"></div>
            </div>

            <!-- results -->
            <div id="results" class="mt-6"></div>
          </div>
        </div>
      </section>

      <!-- ============ GRAPH VIEW ============ -->
      <section id="view-graph" class="view">
        <div class="h-full flex">
          <!-- left rail -->
          <aside class="grail flex flex-col p-4 gap-4 overflow-y-auto">
            <div>
              <div class="text-[13px] font-semibold mb-2 flex items-center justify-between">
                图谱 <select id="gname" class="text-[12px] border border-[color:var(--line)] rounded-lg px-2 py-1 bg-white outline-none"></select>
              </div>
              <div class="flex items-center gap-2 bg-[#f7f8fc] border border-[color:var(--line)] rounded-xl px-3 py-2">
                <svg class="w-4 h-4 text-[color:var(--ink-3)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input id="gsearch" class="flex-1 bg-transparent outline-none text-[13px]" placeholder="定位论文 / 概念…" />
              </div>
            </div>

            <div>
              <div class="text-[12px] uppercase tracking-wider text-[color:var(--ink-3)] mb-1.5">布局</div>
              <div class="flex flex-col gap-1">
                <button class="tool-btn" id="btn-physics" onclick="togglePhysics()">
                  <span class="lg-sw" style="background:#6366f1"></span>物理引擎 <span class="ml-auto text-[11px]" id="physics-state">开</span>
                </button>
                <button class="tool-btn" id="btn-hier" onclick="toggleLayout()">
                  <span class="lg-sw" style="background:#06b6d4"></span>布局 <span class="ml-auto text-[11px]" id="layout-state">力导向</span>
                </button>
                <button class="tool-btn" id="btn-path" onclick="togglePathMode()">
                  <span class="lg-sw" style="background:#f59e0b"></span>路径高亮 <span class="ml-auto text-[11px]" id="path-state">关</span>
                </button>
                <button class="tool-btn" onclick="fitGraph()">
                  <span class="lg-sw" style="background:#10b981"></span>缩放适配
                </button>
              </div>
            </div>

            <div>
              <div class="text-[12px] uppercase tracking-wider text-[color:var(--ink-3)] mb-1.5">引用意图</div>
              <div id="legend-intents" class="flex flex-col gap-0.5"></div>
            </div>
            <div>
              <div class="text-[12px] uppercase tracking-wider text-[color:var(--ink-3)] mb-1.5">节点类型</div>
              <div id="legend-types" class="flex flex-col gap-0.5"></div>
            </div>
            <div class="text-[11.5px] text-[color:var(--ink-3)] leading-relaxed mt-auto">
              ◆ 菱形 = 一条 n-ary 超边（连接多个成员）<br/>双击节点向外扩展一跳 · 单击查看详情
            </div>
          </aside>

          <!-- canvas -->
          <div class="relative flex-1 min-w-0">
            <div id="gcanvas" class="absolute inset-0"></div>
            <div id="gempty" class="absolute inset-0 hidden items-center justify-center z-10">
              <div class="empty-card rounded-2xl p-8 text-center max-w-[380px]">
                <div class="flex justify-center mb-3"><div class="spin"></div></div>
                <div class="text-[15px] font-semibold">知识图谱正在构建</div>
                <p class="text-[13px] text-[color:var(--ink-2)] mt-2 leading-relaxed" id="gempty-msg">
                  论文正在逐篇抽取为知识超边，稍后回来即可看到关系网络生长。
                </p>
                <button onclick="loadGraph(true)" class="mt-4 text-[13px] text-white px-4 py-2 rounded-lg" style="background:var(--indigo)">刷新</button>
              </div>
            </div>
            <!-- provenance drawer -->
            <div id="drawer">
              <div class="p-5 h-full overflow-y-auto">
                <div class="flex items-start justify-between">
                  <div class="text-[11px] uppercase tracking-wider text-[color:var(--ink-3)]" id="d-kind">详情</div>
                  <button onclick="closeDrawer()" class="text-[color:var(--ink-3)] hover:text-[color:var(--ink)] -mt-1 text-lg leading-none">×</button>
                </div>
                <div id="d-body" class="mt-2"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================ state ============================ */
const S = {
  view:'search', graphName:'llm_domain', network:null,
  nodes:new vis.DataSet(), edges:new vis.DataSet(),
  loadedNode:new Set(), legend:null,
  hiddenIntents:new Set(), hiddenTypes:new Set(),
  physics:true, layout:'force', pathMode:false, pathSel:[],
  searchCtrl:null, graphs:[],
};
const $ = s=>document.querySelector(s);
const esc = s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600);}
async function api(path,opts){const r=await fetch(path,opts);return {status:r.status,data:await r.json()};}

/* ============================ view switch ============================ */
function showView(v){
  S.view=v;
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('show'));
  $('#view-'+v).classList.add('show');
  if(v==='graph' && !S.network){ initGraph(); loadGraph(); }
  if(v==='graph' && S.network){ setTimeout(()=>S.network.fit({animation:{duration:400}}),120); }
}

/* ============================ SEARCH ============================ */
const EXAMPLES=["如何提升深度强化学习的样本效率？","大语言模型合成数据生成与质量评估的代表性工作",
                "检索增强生成在金融情感分析中的应用","少样本文本分类的数据增强方法"];
function renderChips(){
  $('#chips').innerHTML=EXAMPLES.map(e=>`<span class="chip" onclick="setQ(this.textContent)">${esc(e)}</span>`).join('');
}
function setQ(t){$('#q').value=t;runSearch();}
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch();});

const STAGES=[["recall","召回"],["grade","判分"],["rank","排序"],["build","建图"]];
function buildTimeline(){
  $('#stages').innerHTML=STAGES.map(([k,l])=>`
    <div class="stage" id="st-${k}">
      <span class="sdot">○</span><div class="flex-1 min-w-0">
        <div class="flex justify-between text-[12px]"><span>${l}</span><span class="mono text-[color:var(--ink-3)]" id="st-${k}-t"></span></div>
        <div class="bar"><i></i></div></div>
    </div>`).join('');
}
function setStage(k,state){ // state: ''|doing|done
  const el=$('#st-'+k);el.classList.remove('doing','done');if(state)el.classList.add(state);
  el.querySelector('.sdot').textContent= state==='done'?'✓':(state==='doing'?'◐':'○');
}

async function runSearch(){
  const q=$('#q').value.trim(); if(!q){toast('请输入查询');return;}
  if(S.searchCtrl)S.searchCtrl.abort();
  S.searchCtrl=new AbortController();
  const t0=performance.now();
  // UI: timeline on, skeleton results
  $('#timeline').classList.remove('hidden'); buildTimeline();
  $('#results').innerHTML=`<div class="flex flex-col gap-3">${[0,1,2].map(()=>`<div class="skeleton h-[84px]"></div>`).join('')}</div>`;
  setStage('recall','doing');
  // optimistic stage advance while waiting
  const timers=[setTimeout(()=>{setStage('recall','done');setStage('grade','doing');},2600),
                setTimeout(()=>{setStage('grade','done');setStage('rank','doing');},6200)];
  const el=$('#elapsed');const tick=setInterval(()=>{el.textContent=((performance.now()-t0)/1000).toFixed(1);},100);
  try{
    const {status,data}=await api('/api/search',{method:'POST',signal:S.searchCtrl.signal,
      headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})});
    clearInterval(tick);timers.forEach(clearTimeout);
    if(status!==200||data.error){toast('检索失败：'+(data.error||status));$('#results').innerHTML='';return;}
    finalizeTimeline(data.timing);
    renderResults(q,data);
    if(data.cost&&data.cost.usd!=null)$('#lamp-cost').textContent='$'+data.cost.usd.toFixed(3);
  }catch(e){clearInterval(tick);timers.forEach(clearTimeout);
    if(e.name!=='AbortError')toast('请求失败');$('#results').innerHTML='';}
}
function finalizeTimeline(t){
  const rs=t.recall_s, rest=Math.max(0,t.total_s-rs);
  setStage('recall','done');$('#st-recall-t').textContent=rs+'s';$('#st-recall .bar>i').style.width='100%';
  setStage('grade','done');$('#st-grade-t').textContent=(rest*0.5).toFixed(1)+'s';$('#st-grade .bar>i').style.width='100%';
  setStage('rank','done');$('#st-rank-t').textContent=(rest*0.5).toFixed(1)+'s';$('#st-rank .bar>i').style.width='100%';
  setStage('build','done');$('#st-build-t').textContent='—';$('#st-build .bar>i').style.width='100%';
}

let lastPapers=[];
function renderResults(q,data){
  lastPapers=data.papers||[];
  const n=data.n_recall, total=data.timing.total_s;
  $('#results').innerHTML=`
    <div class="flex items-center justify-between mb-3">
      <div class="text-[13px] text-[color:var(--ink-2)]"><span class="mono font-semibold text-[color:var(--ink)]">${lastPapers.length}</span> 篇结果
        <span class="text-[color:var(--ink-3)]">· ${n} 候选召回 · ${total}s</span></div>
      <div class="seg"><button class="on" id="m-list" onclick="setMode('list')">列表</button>
        <button id="m-graph" onclick="setMode('graph')">图谱</button></div>
    </div>
    <div id="res-list"></div><div id="res-graph" class="hidden"></div>`;
  $('#res-list').innerHTML=lastPapers.map((p,i)=>`
    <div class="pcard card" style="animation-delay:${i*40}ms" onclick='openPaper(${JSON.stringify(p).replace(/'/g,"&#39;")})'>
      <div class="flex items-start gap-3">
        <div class="mono text-[13px] text-[color:var(--ink-3)] w-6 text-right flex-none mt-0.5">${p.rank}</div>
        <div class="min-w-0 flex-1">
          <div class="text-[14.5px] font-medium leading-snug">${esc(p.title)}</div>
          <div class="flex items-center gap-3 mt-1.5 text-[12px] text-[color:var(--ink-3)]">
            ${p.year?`<span class="mono">${p.year}</span>`:''}
            <span class="mono">被引 ${fmtCite(p.citations)}</span>
            ${p.sem!=null?`<span class="mono">语义 ${(p.sem).toFixed(2)}</span>`:''}
            <span class="badge ${p.band}">${p.band==='high'?'高相关':'相关'}</span>
          </div>
          ${p.abstract?`<p class="text-[12.5px] text-[color:var(--ink-2)] mt-2 leading-relaxed line-clamp-2">${esc(p.abstract)}</p>`:''}
        </div>
      </div>
    </div>`).join('');
}
function fmtCite(n){n=n||0;return n>=1000?(n/1000).toFixed(1)+'k':n;}
function setMode(m){
  $('#m-list').classList.toggle('on',m==='list');$('#m-graph').classList.toggle('on',m==='graph');
  $('#res-list').classList.toggle('hidden',m!=='list');
  $('#res-graph').classList.toggle('hidden',m!=='graph');
  if(m==='graph')loadSearchGraph();
}
async function loadSearchGraph(){
  const box=$('#res-graph');
  box.innerHTML=`<div class="skeleton h-[420px]"></div>`;
  const titles=lastPapers.map(p=>p.title).join('|');
  const {status,data}=await api(`/api/graph/papers?name=${S.graphName}&hops=1&titles=${encodeURIComponent(titles)}`);
  if(status===404||data.empty){box.innerHTML=emptyGraphHTML('知识图谱尚在构建，检索结果暂无法映射到图谱。');return;}
  if(!data.nodes.length){box.innerHTML=emptyGraphHTML(`这 ${lastPapers.length} 篇论文尚未抽取入图谱（未匹配 ${data.unmatched.length} 篇）。`);return;}
  box.innerHTML=`<div class="text-[12px] text-[color:var(--ink-3)] mb-2">
      ${data.matched.length} 篇已在图谱中 · 展示其一跳知识邻域（◆ 为 n-ary 超边）
      ${data.unmatched.length?`· ${data.unmatched.length} 篇未入图`:''}</div>
    <div id="sgcanvas" style="height:440px;border-radius:16px;background:radial-gradient(900px 500px at 70% 20%,#101a30,#0b1220)"></div>`;
  mountNetwork($('#sgcanvas'),data.nodes,data.edges,{height:'440px'});
}
function emptyGraphHTML(msg){return `<div class="empty-card rounded-2xl p-8 text-center">
  <div class="text-[14px] font-semibold">图谱模式</div>
  <p class="text-[13px] text-[color:var(--ink-2)] mt-2">${msg}</p></div>`;}
function openPaper(p){toast('《'+(p.title||'').slice(0,40)+'…》 溯源面板见图谱视图');showView('graph');}

/* ============================ GRAPH ============================ */
function initGraph(){
  if(S.network)return;
  const opts=visOpts();
  S.network=new vis.Network($('#gcanvas'),{nodes:S.nodes,edges:S.edges},opts);
  S.network.on('click',onGraphClick);
  S.network.on('doubleClick',p=>{if(p.nodes.length)expandNode(p.nodes[0]);});
}
function visOpts(){
  return {
    nodes:{borderWidth:1.5,shadow:{enabled:true,color:'rgba(0,0,0,.4)',size:8,x:0,y:2}},
    edges:{smooth:{enabled:true,type:'dynamic',roundness:0.35},shadow:false},
    physics:S.physics?{solver:'barnesHut',barnesHut:{gravitationalConstant:-3200,springLength:95,avoidOverlap:0.25},
                       stabilization:{iterations:120}}:false,
    interaction:{hover:true,tooltipDelay:120,hideEdgesOnDrag:true,multiselect:false},
    layout:S.layout==='hier'?{hierarchical:{enabled:true,direction:'UD',levelSeparation:120,nodeSpacing:140}}
                            :{hierarchical:{enabled:false}},
  };
}
async function loadGraph(refresh){
  const {status,data}=await api(`/api/graph?name=${S.graphName}&max_nodes=160`);
  if(status===404||data.empty){showGraphEmpty(data.hint);return;}
  hideGraphEmpty();
  S.legend=data.legend; buildLegend();
  mergeNodesEdges(data.nodes,data.edges,true);
  if(S.network)S.network.setOptions(visOpts()),S.network.fit({animation:{duration:500}});
  updateLamp(data.stats); buildGraphSelector();
}
function showGraphEmpty(msg){$('#gempty').classList.remove('hidden');$('#gempty').classList.add('flex');
  if(msg)$('#gempty-msg').textContent=msg;}
function hideGraphEmpty(){$('#gempty').classList.add('hidden');$('#gempty').classList.remove('flex');}
function updateLamp(st){
  if(!st)return;
  const has=st.n_hyperedges>0;
  $('#lamp-graph .dot').className='dot '+(has?'ok':'warn');
  $('#lamp-graph-txt').textContent=has?`图谱 ${st.n_hyperedges} 边`:'图谱构建中';
  $('#nav-npapers').textContent=st.n_papers; $('#nav-nedges').textContent=st.n_hyperedges;
}
async function buildGraphSelector(){
  const {data}=await api('/api/graphs');S.graphs=data.graphs||[];
  const sel=$('#gname');
  sel.innerHTML=S.graphs.map(g=>`<option value="${g.name}" ${g.name===S.graphName?'selected':''}>${g.name} (${g.n_concepts})</option>`).join('');
  sel.onchange=()=>{S.graphName=sel.value;clearGraph();loadGraph();};
}
function clearGraph(){S.nodes.clear();S.edges.clear();S.loadedNode.clear();}
function mergeNodesEdges(nodes,edges,reset){
  if(reset){S.nodes.clear();S.edges.clear();S.loadedNode.clear();}
  const nAdd=nodes.filter(n=>!S.nodes.get(n.id));
  const eAdd=edges.filter(e=>!S.edges.get(e.id));
  S.nodes.add(nAdd);S.edges.add(eAdd);
  nodes.forEach(n=>S.loadedNode.add(n.id));
  applyFilters();
}
async function expandNode(id){
  const node=S.nodes.get(id); if(!node||node.group==='hub')return; // expand only real concepts/papers
  const {status,data}=await api(`/api/graph?name=${S.graphName}&center=${encodeURIComponent(id)}&hops=1`);
  if(status!==200||data.empty){toast('无更多邻域');return;}
  const before=S.nodes.length;
  mergeNodesEdges(data.nodes,data.edges,false);
  const added=S.nodes.length-before;
  toast(added>0?`扩展 +${added} 个节点`:'邻域已全部加载');
}

function onGraphClick(p){
  if(S.pathMode){ if(p.nodes.length)pathSelect(p.nodes[0]); return; }
  if(p.nodes.length){
    const nd=S.nodes.get(p.nodes[0]);
    if(nd&&nd.group==='hub'){openDrawer('edge',nd);}else{openDrawer('node',nd);}
    return;
  }
  if(p.edges.length){openDrawer('edge',S.edges.get(p.edges[0])); return;}
  closeDrawer();
}

/* ---- provenance drawer ---- */
function openDrawer(kind,obj){
  if(!obj)return;const m=obj.meta||{};const D=$('#d-body');
  let html=`<div class="text-[15px] font-semibold leading-snug">${esc(m.label||obj.label||obj.id)}</div>`;
  if(kind==='node'){
    $('#d-kind').textContent=m.kind==='paper'?'论文':'概念';
    if(m.type)html+=tag(m.type);
    if(m.definition)html+=kv('定义',m.definition);
    if(m.symbol)html+=kv('符号',m.symbol);
    if(m.years&&(m.years[0]||m.years[1]))html+=kv('年份',m.years.filter(Boolean).join('–'));
    if(m.central)html+=kv('核心实体','是');
    if(m.papers&&m.papers.length)html+=kv('来源论文',m.papers.join(', '));
  }else{
    $('#d-kind').textContent=m.kind==='cites'?'引用关系':'超边';
    if(m.intent)html+=kv('意图',m.intent);
    if(m.pattern)html+=kv('模式',m.pattern);
    if(m.roles&&m.roles.length)html+=kv('角色',m.roles.join(', '));
    if(m.members)html+=kv('成员数',m.members.length);
    if(m.evidence)html+=`<div class="mt-3 text-[12px] uppercase tracking-wider text-[color:var(--ink-3)]">证据原文</div>
      <div class="mt-1 text-[12.5px] leading-relaxed bg-[#f7f8fc] border border-[color:var(--line)] rounded-lg p-3 text-[color:var(--ink-2)]">${esc(m.evidence)}</div>`;
    if(m.papers&&m.papers.length)html+=kv('来源',m.papers.join(', '));
  }
  D.innerHTML=html;$('#drawer').classList.add('open');
}
function kv(k,v){return `<div class="mt-2.5"><span class="kv">${k}</span><div class="text-[13px] mt-0.5">${esc(String(v))}</div></div>`;}
function tag(t){return `<span class="badge mt-2 inline-block" style="background:#eef2ff;color:#4f46e5">${esc(t)}</span>`;}
function closeDrawer(){$('#drawer').classList.remove('open');}

/* ---- legend + filters ---- */
function buildLegend(){
  if(!S.legend)return;
  $('#legend-intents').innerHTML=Object.entries(S.legend.intents).map(([k,c])=>
    `<div class="lg-row" data-intent="${k}" onclick="toggleIntent('${k}')">
       <span class="lg-sw" style="background:${c};border-radius:999px"></span>${k}</div>`).join('');
  const types={...S.legend.types};types['PAPER']='#1e3a8a';
  $('#legend-types').innerHTML=Object.entries(types).map(([k,c])=>
    `<div class="lg-row" data-type="${k}" onclick="toggleType('${k}')">
       <span class="lg-sw" style="background:${c}"></span>${k}</div>`).join('');
  applyFilters();
}
function toggleIntent(k){S.hiddenIntents.has(k)?S.hiddenIntents.delete(k):S.hiddenIntents.add(k);
  document.querySelector(`[data-intent="${k}"]`).classList.toggle('off');applyFilters();}
function toggleType(k){S.hiddenTypes.has(k)?S.hiddenTypes.delete(k):S.hiddenTypes.add(k);
  const el=document.querySelector(`[data-type="${k}"]`);if(el)el.classList.toggle('off');applyFilters();}
function applyFilters(){
  if(!S.legend)return;
  S.edges.forEach(e=>{
    const m=e.meta||{};let hidden=false;
    if(m.kind==='cites'&&S.hiddenIntents.has(m.intent))hidden=true;
    if(m.kind==='hyperedge'&&S.hiddenTypes.has(m.type))hidden=true;
    // hide hub spokes if hub hidden
    S.edges.update({id:e.id,hidden});
  });
  S.nodes.forEach(n=>{
    const m=n.meta||{};let hidden=false;
    if(m.kind==='concept'&&S.hiddenTypes.has(m.type))hidden=true;
    S.nodes.update({id:n.id,hidden});
  });
}

/* ---- layout / physics / fit ---- */
function togglePhysics(){S.physics=!S.physics;$('#physics-state').textContent=S.physics?'开':'关';
  $('#btn-physics').classList.toggle('on',S.physics);S.network.setOptions(visOpts());}
function toggleLayout(){S.layout=S.layout==='force'?'hier':'force';
  $('#layout-state').textContent=S.layout==='force'?'力导向':'分层';
  $('#btn-hier').classList.toggle('on',S.layout==='hier');S.network.setOptions(visOpts());S.network.fit({animation:true});}
function fitGraph(){S.network.fit({animation:{duration:450}});}

/* ---- path highlight ---- */
function togglePathMode(){S.pathMode=!S.pathMode;S.pathSel=[];
  $('#btn-path').classList.toggle('on',S.pathMode);$('#path-state').textContent=S.pathMode?'开':'关';
  if(!S.pathMode)resetDim();else toast('依次点击两个节点以高亮路径');}
function pathSelect(id){
  S.pathSel.push(id);
  if(S.pathSel.length===2){const[a,b]=S.pathSel;highlightPath(a,b);S.pathSel=[];}
}
function highlightPath(a,b){
  // BFS over loaded undirected edges
  const adj={};S.edges.forEach(e=>{if(e.hidden)return;(adj[e.from]=adj[e.from]||[]).push({n:e.to,e:e.id});
    (adj[e.to]=adj[e.to]||[]).push({n:e.from,e:e.id});});
  const prev={},seen=new Set([a]);const q=[a];let found=false;
  while(q.length){const c=q.shift();if(c===b){found=true;break;}
    for(const {n} of (adj[c]||[]))if(!seen.has(n)){seen.add(n);prev[n]=c;q.push(n);}}
  if(!found){toast('两节点间无已加载路径');resetDim();return;}
  const pathN=new Set([b]);let cur=b;while(prev[cur]){pathN.add(prev[cur]);cur=prev[cur];}
  const pathE=new Set();S.edges.forEach(e=>{if(pathN.has(e.from)&&pathN.has(e.to))pathE.add(e.id);});
  S.nodes.forEach(n=>S.nodes.update({id:n.id,opacity:pathN.has(n.id)?1:0.15}));
  S.edges.forEach(e=>S.edges.update({id:e.id,hidden:false,
    color:pathE.has(e.id)?{color:'#f59e0b',opacity:1}:{color:'#334155',opacity:0.08},
    width:pathE.has(e.id)?2.5:1}));
  toast(`路径 ${pathN.size} 个节点`);
}
function resetDim(){S.nodes.forEach(n=>S.nodes.update({id:n.id,opacity:1}));
  S.edges.forEach(e=>S.edges.update({id:e.id,color:undefined,width:undefined}));applyFilters();}

/* ---- in-graph search ---- */
$('#gsearch').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;const t=$('#gsearch').value.trim().toLowerCase();if(!t)return;
  const hit=S.nodes.get().find(n=>((n.meta&&n.meta.label)||n.label||'').toLowerCase().includes(t));
  if(!hit){toast('未找到');return;}
  S.network.focus(hit.id,{scale:1.1,animation:{duration:500}});S.network.selectNodes([hit.id]);
  openDrawer('node',hit);
});

/* ---- shared small-network mount (search graph mode) ---- */
function mountNetwork(el,nodes,edges,extra){
  const n=new vis.Network(el,{nodes:new vis.DataSet(nodes),edges:new vis.DataSet(edges)},
    {...visOpts(),...extra});
  n.on('click',p=>{if(p.nodes.length){const nd=n.body.data.nodes.get(p.nodes[0]);openDrawer('node',nd);}
    else if(p.edges.length){const ed=n.body.data.edges.get(p.edges[0]);openDrawer('edge',ed);}});
  setTimeout(()=>n.fit({animation:{duration:400}}),250);
  return n;
}

/* ============================ boot ============================ */
async function boot(){
  renderChips();
  const {data}=await api('/api/graphs');S.graphs=data.graphs||[];
  if(S.graphs.length){S.graphName=S.graphs[0].name;buildGraphSelector();
    updateLamp({n_papers:S.graphs[0].n_papers,n_hyperedges:S.graphs[0].n_hyperedges});}
}
boot();
</script>
