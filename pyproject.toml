[project]
name = "compile-scholar"
version = "0.4.0"
description = "Compile-time knowledge layer for scientific literature: typed-record extraction, deterministic view compilation, and typed tool access for research agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # both arbitrated at the import gate (tests/test_kb_compiler_import_gate.py):
    # numpy 2026-09-21 (embed_block cosine blocking), pyyaml 2026-09-22 (conf loader)
    # 10-04: lower bound 2.5 -> 2.4 (the env that produced every reported number runs 2.4.6)
    "numpy>=2.4",
    "pyyaml>=6.0",
    # 10-04: answer path (cross-process rate limits in sources/refgraph)
    "filelock>=3.20",
]

[project.optional-dependencies]
# CS2 judging (official astabench scorers driven directly; astabench itself is pinned as a third_party submodule)
eval = [
    "inspect_ai==0.3.268",
    "httpx==0.28.1",
]
# Claude Code harness arm (retrieval MCP server)
harness = [
    "mcp==1.29.0",
]
# baseline arms + evaluation consumers (not needed to build the KB)
baselines = [
    "lightrag-hku==1.5.7",
    "paper-qa==2026.8.12",
    "litellm>=1.84",
    "gpt-researcher==0.16.1",
    "knowledge-storm==1.1.1",
]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
kb = "kb_compiler.cli:main"
compilescholar = "compilescholar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compilescholar", "src/kb_compiler", "src/kb_infra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
