[project]
name = "compile-scholar"
version = "0.4.0"
description = "Compile-time knowledge layer for scientific literature: typed-record extraction, deterministic view compilation, and typed tool access for research agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # both arbitrated at the import gate (tests/test_kb_compiler_import_gate.py):
    # numpy 2026-09-21 (embed_block cosine blocking), pyyaml 2026-09-22 (conf loader)
    "numpy>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# baseline arms + evaluation consumers (not needed to build the KB)
baselines = [
    "lightrag-hku==1.5.7",
    "paper-qa==2026.8.12",
    "litellm>=1.84",
]

[project.scripts]
kb = "kb_compiler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_compiler", "src/kb_infra"]
