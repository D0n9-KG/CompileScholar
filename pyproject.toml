[project]
name = "compile-scholar"
version = "0.5.0.dev0"
description = "Literature layer for scientific agents: diachronic field cognition compiled from self- and other-descriptions of papers, replayable at any date, exposed as as-of tools"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # declared from the package's real imports (10-06, tests/test_path_gate.py keeps src free of scratch paths);
    # exact pins of the environment that produced the recorded numbers
    "numpy==2.4.6",
    "pyyaml==6.0.3",
    "filelock==3.32.2",       # stage locks (dfc.store), cross-process rate limits (sources)
    "httpx==0.28.1",          # the one LLM client (streamed, cancellable)
    "pyarrow==25.0.1",        # IdeaForecastBench parquet (documents)
    "mcp==1.29.0",            # literature tools as an MCP server (tools.mcp_server; harness arm)
]

[project.optional-dependencies]
# CS2 judging (official astabench scorers; astabench is a pinned third_party checkout, installed editable)
eval = [
    "inspect_ai==0.3.268",
]
# baseline arms + evaluation consumers (not needed to build the KB)
baselines = [
    "lightrag-hku==1.5.7",
    "paper-qa==2026.8.12",
    "litellm>=1.84",
    "gpt-researcher==0.16.1",
    "knowledge-storm==1.1.1",
]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
compilescholar = "compilescholar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compilescholar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
