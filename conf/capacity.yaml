# conf/capacity.yaml — 全系统并发预算总表（2026-09-22 实测容量定标）
#
# 容量事实（3 副本 GPUStack，加背景负载探针实测）：
#   64 路 568k tok/min | 96 路 671k | 128 路 684k（p50 延迟 10→21s 翻倍=膝点）
#   => 甜点区间 64-96；总预算取 96，各任务按"内部并发结构"分配
#
# 分配原则：
#   1. 每阶段的分配写在它自己的段里（按项目生命周期排序）
#   2. 单任务独跑 = 吃满自己的段上限；多任务并跑 = kb_infra 的
#      LOCAL_MAX_CONCURRENT 信号量是全局真闸（96），嵌套池不可能超卖
#   3. 每个参数注明它服务的阶段和内部结构理由

# ===== 阶段A：建库（build.py，可重入，断点全在）=====
build:
  # 建库各站按依赖组并行（build.py PARALLEL_GROUPS）：
  #   组extract = deep_extract ∥ table_extract
  #   组check   = postcheck ∥ notation
  slot_pool: 64            # deep_extract 全局 chunk 池（chunk 调用小而多，吃满段）
  postcheck_repair: 48     # 修复池（修复调用与 chunk 同形态）
  notation_batch: 32       # 篇内批池（6 公式/批）
  notation_paper: 6        # 篇级池（×批池≈192 潜在，信号量收敛到 96）
  f35_pool: 32             # 表格语义池（表间独立）
  registry_par_map: 6      # registry 块映射（par_map 默认，块内有嵌入批）

# ===== 阶段B：基线入库（一次性+增量）=====
ingest:
  lightrag_max_async_llm: 24    # LightRAG 内部管线并发（实体/关系抽取调用）
  lightrag_max_parallel_insert: 6
  lightrag_embedding_async: 8   # 嵌入通道独立计数
  paperqa_index_concurrency: 16 # 索引构建（嵌入为主+建卡轻调用）

# ===== 阶段C：答题（三臂并行时）=====
# 2026-09-26 补充实测：单流 32 tok/s（历史最好水平）恢复；16 路并行
# 线性扩展零衰减（428 tok/s 聚合，每路延迟与 8 路时相同）——并发余量
# 充足。外部检索已并行化（P15）：tier 并行发起+子查询 4 路，答题循环
# 每次 search_papers 的墙钟上限=单 tier 上限（15s），不再串行叠加。
answer:
  # 三臂同跑时的分配（我方答题栈 + lightrag + paperqa）：
  #   我方 harness 内部 agent 循环已是多步并发 → 外层 3-4 题
  ours_question_fanout: 4       # evidence_gate2r 题级（harness 现为 max_workers=3 → 提到此值）
  lightrag_query_fanout: 6      # 每题内部 keywords+answer 多调用
  paperqa_query_fanout: 3       # 每题内部 agent 循环重（检索+多步工具）
  # 单臂独跑时可各自乘 2-3（信号量不会超卖）

# ===== 阶段D：判分 =====
judge:
  citation_f1: 0          # 确定性脚本，秒级，无并发需求
  rubric_workers: 16      # judge_answer/judge_kb 的 WORKERS（现 8→16；
                          # GLM-5.3 走 paratera 通道，与本地 GPU 无竞争）
  goldcov_workers: 16     # 同上（judge_kb）

# ===== 全局真闸 =====
# conf/base.yaml llm.local_max_concurrent = 96 —— kb_infra 信号量，所有
# 本地调用的硬顶。任何阶段的任何池嵌套都被它收敛。
