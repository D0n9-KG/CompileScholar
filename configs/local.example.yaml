# Copy to configs/local.yaml (gitignored). Machine resources outside the repository are named here and read with
# compilescholar.core.paths.resource(key); a missing key is an error (there are no hardcoded defaults).
paths:
  arxiv_snapshot: //nas/share/arXiv_Dataset/arxiv-metadata-oai-snapshot.json   # arXiv OAI metadata snapshot
  arxiv_pdf_mirror: //nas/share/JournalPapers/arxiv/arxiv/pdf                   # per-version PDFs <yymm>/<id>vN.pdf
  scihub_index: C:/doi_index_scihub/doi_index.sqlite                            # DOI -> archive index (internal use only)
  scihub_archive: //nas/share/JournalPapers/scihub-mag/sci-mag
  harness_cwd: C:/cs2_harness_cwd                                               # Claude Code harness working directory
  scievo_registry: C:/path/to/sci-evo-extract/data/library/scievo_registry.sqlite     # sci-evo registry (one-off migration source)
  # astabench: third_party/asta-bench (default checkout location; override only if elsewhere)
  # deepscholar_bench: third_party/deepscholar-bench
# Machine-specific overrides of any config section, e.g.:
# runtime:
#   local_max_concurrent: 96
# llm:
#   providers:
#     local: {lanes: 96}
