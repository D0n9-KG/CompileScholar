# Defaults shared by every run (tracked). Machine-specific values go in configs/local.yaml (gitignored); secrets in .env.
answer:
  model: Qwen3.8-27B
  mode: legacy
  kb: true
  ext: true
  cite: false
  screen: true
  state: true
  probe: true
  word_budget: null
  cutoff: null
  kb_dir: .research_tmp/experiments/benchmarks/cs2/base_kb_v2
runtime:
  workers: 3
  local_max_concurrent: 48
  sciverse_max_wait_s: 600
bench:
  name: cs2
  split: dev
  offset: 0
  limit: 100
